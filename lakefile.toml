name = "hex-determinant-mathlib"
defaultTargets = ["HexDeterminantMathlib"]

leanOptions = [
  { name = "doc.verso", value = true },
  { name = "doc.verso.suggestions", value = false },
]

[[require]]
name = "HexMatrixMathlib"
git = "https://github.com/leanprover/hex-matrix-mathlib.git"
rev = "v0.9.0"

[[require]]
name = "HexDeterminant"
git = "https://github.com/leanprover/hex-determinant.git"
rev = "v0.9.0"

[[require]]
name = "HexBareiss"
git = "https://github.com/leanprover/hex-bareiss.git"
rev = "v0.9.0"

[[require]]
name = "mathlib"
git = "https://github.com/leanprover-community/mathlib4.git"
rev = "6b7abb3c7686292736be2955bd3eb9ebf63b456a"

[[lean_lib]]
name = "HexDeterminantMathlib"
